name: Retrain MLflow Project (CI)

on:
  workflow_dispatch:
  push:
    paths:
      - "MLProject/**"
      - ".github/workflows/**"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Install MLflow
        shell: bash -l {0}
        run: |
          pip install mlflow

      - name: Prepare output dir
        working-directory: MLProject
        run: |
          mkdir -p outputs

      - name: Run MLflow Project
        run: |
          mlflow run MLProject \
            -P preproc_dir=namadataset_preprocessing \
            -P tracking_uri=file:./mlruns \
            -P experiment_name=CI_Retrain_Autolog \
            -P seed=42



      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrain-artifacts
          path: MLProject/outputs
